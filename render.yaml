services:
  - type: web
    name: yatrashare-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: node backend/dist/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"
      - key: DATABASE_URL
        value: sqlite://./yatrashare.db
      - key: JWT_ACCESS_SECRET
        value: yatrashare_jwt_access_secret_production_ready_key_12345
      - key: JWT_REFRESH_SECRET
        value: yatrashare_jwt_refresh_secret_production_ready_key_67890
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: PAYMENT_GATEWAY_DEFAULT
        value: MOCK
      - key: EMAIL_PROVIDER
        value: MOCK
      - key: MAP_PROVIDER
        value: OSM
